[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sbp-external-windows-agent"
version = "0.1.0"
description = "Owner-approved external Windows operator agent for SBP project work"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sbp-external-agent = "sbp_external_agent.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
