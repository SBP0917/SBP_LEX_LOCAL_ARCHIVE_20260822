[pytest]
testpaths =
    tests
    external_substrates
    sbp_operator_assistant
addopts = --strict-markers
filterwarnings =
    error
markers =
    linkage_assurance: startup-to-terminal linkage assurance across PQC, measured startup, and H7 execution integrity
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    runtime_artifacts
